name: Build

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  GOLEM_VERSION: "1.6.0-rc1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Golem CLI
        run: |
          curl -fsSL -o golem "https://github.com/golemcloud/golem/releases/download/v${GOLEM_VERSION}/golem-x86_64-unknown-linux-gnu"
          chmod +x golem
          sudo mv golem /usr/local/bin/
          golem --version

      - name: Build
        run: golem build --yes
