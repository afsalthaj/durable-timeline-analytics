[workspace]
resolver = "2"
members = [
    "components-rust/*",
    "common-rust/*",
    "services/event-generator",
    "services/kafka-producer",
    "services/kafka-consumer-feeder",
    "services/dashboard",
    "test/integration-harness",
]
exclude = ["test/sample-event-feeder", "test/sample-event-producer"]

[profile.release]
opt-level = "s"
lto = true
strip = "symbols"

[workspace.dependencies]
golem-rust = { version = "=3.0.0-rc2", features = ["export_golem_agentic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Golem's Rust template builds the WIT bindings with Golem's forked wit-bindgen,
# which shrinks the lift/lower wrappers generated for golem-rust.
[patch.crates-io]
wit-bindgen = { git = "https://github.com/golemcloud/wit-bindgen", branch = "golem-outline-lift-v0.58.0", version = "=0.59.0" }
