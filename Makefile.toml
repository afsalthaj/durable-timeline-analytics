[config]
default_to_workspace = false

[tasks.build]
description = "Build the WASM component"
command = "golem"
args = ["build", "--yes"]

[tasks.check]
description = "Check all crates compile, including the component for wasm32-wasip2"
script_runner = "@shell"
script = '''
set -e
cargo check --workspace --all-targets
cargo check -p timeline_core --target wasm32-wasip2
'''

[tasks.unit-test]
description = "Run unit tests (no Golem server needed)"
command = "cargo"
args = ["test", "--workspace"]

[tasks.smoke]
description = "Run the smoke tests against a fresh local Golem server"
command = "scripts/integration.sh"
args = ["smoke"]

[tasks.propagation]
description = "Run the push-cascade tests against a fresh local Golem server"
command = "scripts/integration.sh"
args = ["propagation"]

[tasks.aggregation]
description = "Run the cross-session aggregation tests against a fresh local Golem server"
command = "scripts/integration.sh"
args = ["aggregation"]

[tasks.kafka-test]
description = "Run the Kafka pipeline test (requires Docker)"
command = "scripts/integration.sh"
args = ["--kafka", "kafka"]

[tasks.integration]
description = "Run all Golem integration tests except Kafka"
command = "scripts/integration.sh"
args = ["smoke", "propagation", "aggregation"]

[tasks.test]
clear = true
description = "Run all integration tests (starts/stops Golem + Kafka, requires Docker)"
command = "scripts/integration.sh"
args = ["--kafka", "smoke", "propagation", "aggregation", "kafka"]

[tasks.demo]
clear = true
description = "Run a CIRR demo with aggregation across 3 CDNs and open the dashboard"
script_runner = "@shell"
script = '''
set -e
COMPOSE_FILE=test/integration-harness/docker/compose.yml
cleanup() {
    echo ""
    echo "Stopping dashboard..."
    [ -n "$DASH_PID" ] && kill "$DASH_PID" 2>/dev/null || true
    echo "Stopping Golem..."
    [ -n "$GOLEM_PID" ] && kill "$GOLEM_PID" 2>/dev/null || true
    echo "Stopping Kafka..."
    docker compose -f "$COMPOSE_FILE" down -v 2>/dev/null || true
    echo "Cleanup done."
}
trap cleanup EXIT

echo "╔══════════════════════════════════════════════════════════════╗"
echo "║  CIRR Demo — Connection Induced Rebuffering Ratio          ║"
echo "║                                                            ║"
echo "║  duration_where(                                           ║"
echo "║    has_existed(playerStateChange == \"play\")                 ║"
echo "║    && !has_existed_within(playerStateChange == \"seek\", 5)   ║"
echo "║    && latest_event_to_state(playerStateChange) == \"buffer\"  ║"
echo "║  ) | aggregate(group_by(cdn), count, sum, avg)             ║"
echo "╚══════════════════════════════════════════════════════════════╝"
echo ""

# --- Start infrastructure ---
echo "==> Starting Golem server..."
mkdir -p golem-temp
golem server run --clean --yes > golem-temp/server.log 2>&1 &
GOLEM_PID=$!
for i in $(seq 1 120); do
    nc -z 127.0.0.1 9881 2>/dev/null && break
    sleep 1
done
nc -z 127.0.0.1 9881 2>/dev/null || { echo "ERROR: Golem server did not start"; exit 1; }
echo "    Golem server ready."

echo "==> Building and deploying component..."
golem build --yes
golem deploy --yes || { sleep 5; golem deploy --yes; }
echo "    Component deployed."

echo "==> Starting Kafka..."
docker compose -f "$COMPOSE_FILE" up -d
for i in $(seq 1 60); do
    nc -z 127.0.0.1 9092 2>/dev/null && break
    sleep 1
done
nc -z 127.0.0.1 9092 2>/dev/null || { echo "ERROR: Kafka did not start"; exit 1; }
echo "    Kafka ready."

# --- Generate events into Kafka ---
echo ""
echo "==> Generating events into Kafka..."
KAFKA_TOPIC=timeline-events SESSION_COUNT=9 EVENTS_PER_SESSION=50 cargo run -p kafka-producer 2>/dev/null
echo "    Events published to Kafka topic 'timeline-events'."

# --- Start dashboard ---
if [ -z "${DASHBOARD_PORT:-}" ]; then
    for p in $(seq 3000 3020); do
        if ! nc -z 127.0.0.1 "$p" 2>/dev/null; then
            DASHBOARD_PORT=$p
            break
        fi
    done
fi
if [ -z "${DASHBOARD_PORT:-}" ]; then
    echo "ERROR: no free port in 3000-3020"
    exit 1
fi
if [ "$DASHBOARD_PORT" != 3000 ]; then
    echo "==> Port 3000 is in use; starting dashboard at http://localhost:$DASHBOARD_PORT ..."
else
    echo "==> Starting dashboard at http://localhost:$DASHBOARD_PORT ..."
fi
KAFKA_BROKER=127.0.0.1:9092 KAFKA_TOPIC=timeline-events DASHBOARD_PORT="$DASHBOARD_PORT" cargo run -p dashboard &
DASH_PID=$!

for i in $(seq 1 60); do
    if nc -z 127.0.0.1 "$DASHBOARD_PORT" 2>/dev/null; then
        break
    fi
    if ! kill -0 "$DASH_PID" 2>/dev/null; then
        echo "ERROR: dashboard exited before binding to port $DASHBOARD_PORT"
        wait "$DASH_PID" || true
        exit 1
    fi
    sleep 1
done
nc -z 127.0.0.1 "$DASHBOARD_PORT" 2>/dev/null || {
    echo "ERROR: dashboard did not bind to port $DASHBOARD_PORT"
    exit 1
}

echo ""
echo "════════════════════════════════════════════════════════════════"
echo "  Dashboard running at http://localhost:$DASHBOARD_PORT"
echo ""
echo "  1. Click the 'Deploy Metric' tab"
echo "  2. Enter a metric name (e.g., 'cirr') and the DSL expression"
echo "  3. Click 'Deploy Metric'"
echo "     → The feeder starts consuming from Kafka and feeding events"
echo "       to the Golem agents automatically"
echo "  4. Switch to 'Computation Progress' to see per-session results"
echo "  5. Switch to 'Live Dashboard' to see aggregation across CDNs"
echo ""
echo "  Press Ctrl+C to stop everything"
echo "════════════════════════════════════════════════════════════════"

wait $DASH_PID
'''
