[package]
name = "common-lib"
version = "0.1.0"
edition = "2024"

[features]
# Derives `golem_rust::Schema` on the domain types so the WASM component can
# use them directly as agent parameters and results.
golem = ["dep:golem-rust"]

[dependencies]
golem-rust = { workspace = true, optional = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
