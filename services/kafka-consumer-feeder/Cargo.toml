[package]
name = "kafka-consumer-feeder"
version = "0.1.0"
edition = "2024"
description = "Consumes events from Kafka and feeds them to the timeline's leaf agents via the golem CLI. Reusable for local testing and cloud deployments."

[dependencies]
common-lib = { path = "../../common-rust/common-lib" }
timeline-client = { path = "../../common-rust/timeline-client" }
rdkafka = { version = "0.36", features = ["cmake-build"] }
tokio = { version = "1", features = ["full"] }
serde_json = { workspace = true }
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "kafka-consumer-feeder"
path = "src/main.rs"
