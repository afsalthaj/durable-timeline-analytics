[package]
name = "sample-event-feeder"
edition = "2024"
version = "0.0.1"
description = "Feeds events from a Pulsar topic to the leaf agents returned by the timeline driver"

[dependencies]
common-lib = { path = "../../common-rust/common-lib" }
env_logger = "0.11"
futures = "0.3"
log = "0.4"
pulsar = { version = "6", default-features = false, features = ["tokio-runtime", "auth-oauth2"] }
serde_json = "1"
timeline-client = { path = "../../common-rust/timeline-client" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "sample-event-feeder"
