[package]
name = "sample-event-producer"
edition = "2024"
version = "0.0.1"
description = "Publishes a sample CIRR playback session to a Pulsar topic"

[dependencies]
common-lib = { path = "../../common-rust/common-lib" }
env_logger = "0.11"
log = "0.4"
pulsar = { version = "6", default-features = false, features = ["tokio-runtime", "auth-oauth2"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[bin]]
name = "sample-event-producer"
